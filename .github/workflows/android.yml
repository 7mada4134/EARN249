name: Build EARN249 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check Flutter
        run: flutter doctor -v

      - name: Check project
        run: |
          ls -la
          ls -la android
          flutter --version

      - name: Install dependencies
        run: flutter pub get -v

      - name: Build APK
        run: flutter build apk --release -v

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: EARN249-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Save diagnostic logs
        if: always()
        run: |
          echo "Build diagnostic completed"
          flutter doctor -v || true
