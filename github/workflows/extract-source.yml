name: Extract EARN249 Source

on:
  push:
    paths:
      - 'EARN249.zip'
      - '.github/workflows/extract-source.yml'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          if [ -f EARN249.zip ]; then
            unzip -o EARN249.zip -d .
            rm EARN249.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Extract EARN249 source files" || true
            git push
          fi
